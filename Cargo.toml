[workspace]
members=[
    "crates/core"
, "crates/gui"]

[workspace.dependencies]
anyhow = "1.0.104"
dotenv = "0.15.0"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4"] }
axum = { version = "0.8.9", features = ["ws"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros"] }
chrono = "0.4.45"
