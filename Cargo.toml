[workspace]
members=[
    "crates/core", "crates/server", "crates/simulator",
]

[workspace.dependencies]
anyhow = "1.0.104"
dotenv = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
axum = { version = "0.8.9", features = ["ws"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
chrono = "0.4.45"
